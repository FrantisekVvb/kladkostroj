<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Kladkostroj</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: #ffffff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #stage[data-tool="pencil"] {
        cursor: crosshair;
      }

      #stage[data-tool="pencil"] .pulley {
        pointer-events: none;
      }

      .toolbar {
        position: absolute;
        z-index: 20;
        top: max(12px, env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(15, 23, 42, 0.12);
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      }

      .toolbar button {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: #0f172a;
        font: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .toolbar button:hover {
        background: #f1f5f9;
      }

      .toolbar button.is-active {
        background: #0f172a;
        color: #fff;
      }

      .toolbar button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .pulley {
        position: absolute;
        z-index: 2;
        cursor: grab;
        touch-action: none;
        line-height: 0;
      }

      .pulley:active,
      .pulley.is-dragging {
        cursor: grabbing;
        z-index: 10;
      }

      .pulley svg {
        display: block;
        pointer-events: none;
        max-width: none;
        height: auto;
      }

      .pulley--fixed {
        transform-origin: 50% 0%;
        will-change: transform;
      }

      .pulley--fixed svg {
        width: 112px;
      }

      .pulley--free {
        transform: rotate(180deg);
        transform-origin: 50% 50%;
      }

      .pulley--free svg {
        width: 104px;
      }

      .weight {
        position: absolute;
        z-index: 3;
        cursor: grab;
        touch-action: none;
        line-height: 0;
      }

      .weight:active,
      .weight.is-dragging {
        cursor: grabbing;
        z-index: 11;
      }

      .weight svg {
        display: block;
        pointer-events: none;
        width: 70px;
        height: auto;
      }

      .weight.is-snapping {
        filter: drop-shadow(0 0 0 #58a1ff);
        outline: 2px dashed #58a1ff;
        outline-offset: 2px;
        border-radius: 4px;
      }

      #stage[data-tool="pencil"] .weight {
        pointer-events: none;
      }

      #stage[data-tool="run"] .pulley,
      #stage[data-tool="run"] .weight,
      #stage[data-tool="run"] #rope-layer {
        pointer-events: none;
        cursor: default;
      }

      .toolbar button.is-run {
        background: #16a34a;
        color: #fff;
      }

      .toolbar button.is-run:hover {
        background: #15803d;
      }

      #rope-layer {
        position: absolute;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      #stage[data-tool="pencil"] #rope-layer {
        pointer-events: auto;
        touch-action: none;
      }

      .rope-path {
        fill: none;
        stroke: #1d1d1b;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .rope-path.is-draft {
        stroke: #64748b;
        stroke-width: 5;
        opacity: 0.8;
      }

      .rope-path.is-draft.is-snapping {
        stroke: #0f172a;
        opacity: 1;
      }

      #stage[data-tool="move"] {
        cursor: default;
      }

      #stage[data-tool="move"] #rope-layer .rope-end-handle {
        pointer-events: auto;
        touch-action: none;
      }

      .rope-end-handle {
        fill: rgba(88, 161, 255, 0.22);
        stroke: #58a1ff;
        stroke-width: 2;
        cursor: grab;
        pointer-events: none;
      }

      .rope-end-handle.is-dragging {
        cursor: grabbing;
        fill: rgba(88, 161, 255, 0.42);
      }

      .rope-end-handle.is-snapping {
        fill: rgba(15, 23, 42, 0.18);
        stroke: #0f172a;
      }

      .rope-snap {
        fill: none;
        stroke: #58a1ff;
        stroke-width: 2;
        stroke-dasharray: 4 4;
        pointer-events: none;
      }

      #force-overlay {
        position: absolute;
        inset: 0;
        z-index: 15;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .force-arrow {
        pointer-events: none;
      }

      .force-arrow-shaft {
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      .force-arrow-head {
        stroke-width: 0;
      }

      .force-arrow.is-gravity .force-arrow-shaft,
      .force-arrow.is-gravity .force-arrow-head {
        stroke: #c2410c;
        fill: #c2410c;
      }

      .force-arrow.is-tension .force-arrow-shaft,
      .force-arrow.is-tension .force-arrow-head {
        stroke: #2563eb;
        fill: #2563eb;
      }

      .force-arrow.is-net .force-arrow-shaft,
      .force-arrow.is-net .force-arrow-head {
        stroke: #15803d;
        fill: #15803d;
      }

      .force-arrow-label {
        font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
        fill: #334155;
        paint-order: stroke;
        stroke: #fff;
        stroke-width: 3px;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-tool="move" aria-label="Plocha s kladkami">
      <div class="toolbar" role="toolbar" aria-label="Nástroje">
        <button type="button" id="tool-move" class="is-active" aria-pressed="true">
          Přesun
        </button>
        <button type="button" id="tool-pencil" aria-pressed="false">
          Tužka
        </button>
        <button type="button" id="tool-run" aria-pressed="false">
          Spustit
        </button>
        <button type="button" id="tool-clear" disabled>Smazat lano</button>
      </div>

      <svg id="rope-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

            stroke="#1D1D1B"

            stroke-linecap="round"
          />
        </svg>
      </div>

      <div
        class="pulley pulley--free"
        id="free-pulley"
        role="img"
        aria-label="Volná kladka"
        style="left: 58%; top: 28%"
      >

      </div>
    </div>

  </body>
</html>
